<html lang="ru">

  <title>Садаева Хеда Дениковна</title>
  <style>
    :root{color-scheme:light dark}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;background:#0f1217;color:#e8eef6}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:420px;background:#141a22;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:18px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

    .muted{color:rgba(232,238,246,.72);font-size:.88rem;line-height:1.45}

    input{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0e131a;color:#e8eef6;padding:12px 12px;font-size:1rem}
    button{width:100%;margin-top:10px;border-radius:12px;border:0;background:#c9a53b;color:#111;font-weight:800;padding:11px 12px;font-size:1rem;cursor:pointer}
    button:disabled{opacity:.65;cursor:not-allowed}
    .err{color:#ff6b6b;font-size:.88rem;margin-top:10px;min-height:1.2em}
    .tiny{font-size:.78rem;color:rgba(232,238,246,.55);margin-top:10px}
    code{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
  </style>
</head>

      };
      const $ = (id) => document.getElementById(id);
      const btn = $("btn");
      const inp = $("pwd");
      const err = $("err");

      function b64ToU8(b64){
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
        return out;
      }
      async function deriveKey(password, saltBytes, iterations){
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: saltBytes, iterations: iterations, hash: "SHA-256" },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }
      async function tryOpen(){
        err.textContent = "";
        const pwd = (inp.value || "").trim();
        if (!pwd) { err.textContent = "Введите пароль"; return; }
        btn.disabled = true;
        btn.textContent = "Открываю…";
        try{
          const key = await deriveKey(pwd, b64ToU8(meta.salt), meta.it);
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToU8(meta.iv) }, key, b64ToU8(meta.ct));
          const html = new TextDecoder().decode(plain);
          document.open();
          document.write(html);
          document.close();
        }catch(e){
          err.textContent = "Неверный пароль";
          btn.disabled = false;
          btn.textContent = "Открыть";
          try{ inp.focus(); inp.select(); }catch{}
        }
      }
      btn.onclick = tryOpen;
      inp.onkeydown = (e) => { if (e.key === "Enter") tryOpen(); };
      setTimeout(() => { try{ inp.focus(); }catch{} }, 50);
    })();
